[package]
name = "dragon-fnd"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"

[features]
default = []
logging = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-appender", "dep:flate2", "dep:time"]
_async = []  # internal — activated by any async subsystem
sqlite = ["dep:sqlx", "_async"]
shutdown = ["dep:tokio", "dep:tokio-util", "_async"]
http = ["dep:axum", "shutdown"]
# fs = []

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"], optional = true }
tracing-appender = { version = "0.2", optional = true }
flate2 = { version = "1", optional = true }
time = { version = "0.3", features = ["formatting", "macros", "std"], optional = true }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"], optional = true }
tokio = { version = "1", features = ["signal", "rt", "time", "macros"], optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }

[dev-dependencies]
tempfile = "3"
serial_test = "3"
toml = "0.8"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
